<div class="min-h-screen p-10">
    <div *ngIf="drivers && drivers.length > 0">
        <h3 class="text-center">Your drivers:</h3>
        <div class="flex flex-wrap gap-10 justify-center">
            <app-add-card routerLink="/create-driver" />
            <app-driver-card *ngFor="let driver of drivers" [driver]="driver" />
        </div>
        <mat-paginator
            class="flex mt-5"
            aria-label="Select page"
            (page)="handlePageEvent($event)"
            [length]="totalElements"
            [pageSize]="pageSize"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [pageIndex]="pageIndex"
        >
        </mat-paginator>
    </div>
    <div
        *ngIf="drivers && drivers.length === 0"
        class="text-center flex flex-col items-center gap-5"
    >
        <h3>You don't have any driver in your fleet!</h3>
        <app-add-card routerLink="/create-driver" />
    </div>
</div>
