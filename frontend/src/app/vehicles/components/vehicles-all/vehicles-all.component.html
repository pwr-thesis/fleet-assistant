<div class="min-h-screen p-10">
    <div *ngIf="vehicles && vehicles.length > 0">
        <h3 class="text-center">
            {{ isDriver() ? 'Assigned vehicles:' : 'Your fleet:' }}
        </h3>
        <div class="flex flex-wrap gap-10 justify-center">
            <app-add-card *ngIf="!isDriver()" routerLink="/new-vehicle" />
            <app-vehicle-card
                *ngFor="let vehicle of vehicles"
                [vehicle]="vehicle"
                [isDriver]="isDriver()"
            />
        </div>
        <mat-paginator
            class="flex mt-5"
            aria-label="Select page"
            (page)="handlePageEvent($event)"
            [length]="totalElements"
            [pageSize]="pageSize"
            [showFirstLastButtons]="true"
            [pageSizeOptions]="pageSizeOptions"
            [pageIndex]="pageIndex"
        >
        </mat-paginator>
    </div>
    <div
        *ngIf="vehicles && vehicles.length === 0"
        class="text-center flex flex-col items-center gap-5"
    >
        <h3>
            {{
                isDriver()
                    ? 'There are no vehicles currently assigned to you!'
                    : "You don't have any vehicle in your fleet!"
            }}
        </h3>
        <app-add-card *ngIf="!isDriver()" routerLink="/new-vehicle" />
    </div>
</div>
