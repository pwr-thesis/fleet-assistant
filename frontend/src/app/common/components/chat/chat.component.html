<div class="chat-container">
    <div class="messages">
        <p *ngFor="let message of messages; let i = index" 
           [ngClass]="{
               'first-message': i === 0,
               'bot-message': message.startsWith('Bot:'),
               'user-message': message.startsWith('You:')
           }">{{ message }}</p>
    </div>
    <div class="input-area">
        <input [(ngModel)]="newMessage" placeholder="Type your message here..." />
        <button (click)="sendMessage()">Send</button>
    </div>
</div>
